name: medical_care_app
description: Cloud-Based Healthcare Record System
publish_to: 'none'
version: 2.0.0+10

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core
  dartz: ^0.10.1

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.2
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.1.5
  firebase_analytics: ^11.3.5
  firebase_crashlytics: ^4.1.5

  # UI
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0
  table_calendar: ^3.1.2
  cached_network_image: ^3.4.1

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0

  # Navigation
  go_router: ^14.6.2

  # State Management
  provider: ^6.1.2

  # Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.5

  # Authentication & Security
  local_auth: ^2.3.0
  local_auth_android: ^1.0.50
  local_auth_darwin: ^1.4.1
  crypto: ^3.0.3

  # Device & Permissions
  device_info_plus: ^10.1.2
  permission_handler: ^11.3.1
  package_info_plus: ^8.1.1

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.6

  # Image
  image_picker: ^1.1.2
  image_cropper: ^9.0.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Network
  connectivity_plus: ^6.1.1
  http: ^1.2.2

  # Documents
  pdf: ^3.11.1
  printing: ^5.13.4
  open_file: ^3.5.9

  # Utilities
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  uuid: ^4.5.1
  flutter_slidable: ^4.0.3
  flutter_staggered_animations: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
